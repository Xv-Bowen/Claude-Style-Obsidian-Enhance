name: Attest release files

# Records where main.js and manifest.json of a release come from (GitHub artifact attestations), so anyone can check
# that the files attached to a release are the ones published from this repository:
#   gh attestation verify main.js --repo Xv-Bowen/Claude-Style-Obsidian-Enhance

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern main.js --pattern manifest.json --dir release
      - name: Attest them
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/main.js
            release/manifest.json
